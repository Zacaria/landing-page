<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200" />
    <title>HaveSomeCode social card source</title>
    <style>
      @font-face { font-family: "Instrument Serif"; font-style: normal; src: url("../client/assets/fonts/instrument-serif-regular.woff2") format("woff2"); }
      @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("../client/assets/fonts/instrument-serif-italic.woff2") format("woff2"); }
      @font-face { font-family: "Geist"; src: url("../client/assets/fonts/geist-regular.woff2") format("woff2"); }
      @font-face { font-family: "Geist Mono"; src: url("../client/assets/fonts/geist-mono.woff2") format("woff2"); }

      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
      body { background: #0b0b0c; color: #ece8e1; }
      .card { position: relative; width: 1200px; height: 630px; padding: 64px 72px; display: flex; flex-direction: column; }
      .meta { font: 400 18px/1 "Geist Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: #a29e97; }
      .meta b { font-weight: 400; color: #d4ff4f; margin-left: 14px; }
      .site { position: absolute; right: 72px; top: 64px; font: 400 18px/1 "Geist Mono", monospace; letter-spacing: .08em; color: #a29e97; }
      h1 { margin: 40px 0 0; font: 400 108px/.98 "Instrument Serif", Georgia, serif; letter-spacing: -.02em; }
      h1 em { color: #d4ff4f; }
      p { margin: auto 0 0; max-width: 960px; font: 400 27px/1.4 "Geist", sans-serif; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="meta">HaveSomeCode<b>Zacaria Chtatar</b></div>
      <span class="site">havesomecode.io</span>
      <h1>Qu’est-ce qui vous coûte<br /><em>le plus de temps</em> chaque jour&nbsp;?</h1>
      <p>Je fais communiquer vos outils entre eux pour réduire les tâches sans valeur ajoutée. Vous gardez la main sur chaque action finale.</p>
    </main>
  </body>
</html>
