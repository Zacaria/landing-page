<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200" />
    <title>HaveSomeCode social card source</title>
    <style>
      @font-face {
        font-family: "Newsreader";
        font-style: normal;
        font-weight: 400 500;
        font-display: swap;
        src: url("../client/assets/fonts/newsreader.woff2") format("woff2");
      }

      @font-face {
        font-family: "Manrope";
        font-style: normal;
        font-weight: 400 600;
        font-display: swap;
        src: url("../client/assets/fonts/manrope.woff2") format("woff2");
      }

      @font-face {
        font-family: "DM Mono";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("../client/assets/fonts/dm-mono-medium.woff2") format("woff2");
      }

      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
      body { background: #f1eee6; color: #172019; }
      .card { position: relative; width: 1200px; height: 630px; overflow: hidden; border: 1px solid rgba(23,32,25,.22); }
      .header { position: absolute; inset: 0 0 auto; height: 76px; display: flex; align-items: center; justify-content: space-between; padding: 0 48px; border-bottom: 1px solid rgba(23,32,25,.22); }
      .name { font: 500 24px/1 "Newsreader", Georgia, serif; }
      .site { color: #1f5b47; font: 500 11px/1 "DM Mono", monospace; letter-spacing: .12em; text-transform: uppercase; }
      .copy { position: absolute; top: 76px; left: 0; width: 760px; height: 436px; padding: 58px 48px; border-right: 1px solid rgba(23,32,25,.22); }
      .eyebrow { margin: 0 0 24px; color: #1f5b47; font: 500 11px/1 "DM Mono", monospace; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; max-width: 670px; font: 500 70px/.92 "Newsreader", Georgia, serif; letter-spacing: -.052em; }
      .visual { position: absolute; top: 76px; right: 0; width: 440px; height: 436px; overflow: hidden; }
      .watermark { position: absolute; top: 18px; right: -8px; color: rgba(31,91,71,.08); font: 500 132px/1 "Newsreader", Georgia, serif; }
      .portrait { position: absolute; right: 42px; bottom: 0; width: 282px; height: 330px; object-fit: cover; filter: saturate(.78) contrast(.95); }
      .location { position: absolute; right: 42px; bottom: 0; padding: 10px 13px; background: #c64f2b; color: white; font: 500 10px/1 "DM Mono", monospace; letter-spacing: .1em; text-transform: uppercase; }
      .doors { position: absolute; inset: auto 0 0; height: 118px; display: grid; grid-template-columns: repeat(4,1fr); background: #1f5b47; color: #fbfaf6; }
      .door { display: flex; flex-direction: column; justify-content: center; padding: 20px 28px; border-right: 1px solid rgba(251,250,246,.22); }
      .door:last-child { border-right: 0; }
      .door strong { font: 500 36px/.95 "Newsreader", Georgia, serif; letter-spacing: -.04em; }
      .door span { margin-top: 10px; color: #b8d7ca; font: 400 10px/1.2 "DM Mono", monospace; letter-spacing: .06em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main class="card">
      <header class="header">
        <span class="name">Zacaria Chtatar</span>
        <span class="site">HaveSomeCode · A corner of the web</span>
      </header>
      <section class="copy">
        <p class="eyebrow">Hello · I’m Zacaria</p>
        <h1>Software, side projects &amp; questions worth following.</h1>
      </section>
      <section class="visual">
        <span class="watermark">WHY?</span>
        <img class="portrait" src="../client/assets/portrait-responsive/portrait-w_600.jpg" alt="" />
        <span class="location">France · Usually building something</span>
      </section>
      <section class="doors">
        <div class="door"><strong>Make</strong><span>Small tools</span></div>
        <div class="door"><strong>Learn</strong><span>Current obsessions</span></div>
        <div class="door"><strong>Share</strong><span>Talks + notes</span></div>
        <div class="door"><strong>Lead</strong><span>Hard questions</span></div>
      </section>
    </main>
  </body>
</html>
