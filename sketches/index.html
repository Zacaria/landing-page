<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zacaria Chtatar — Visual identity sketches</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111318;color:#f5f6f8;overflow:hidden}.bar{height:72px;border-bottom:1px solid #30343c;display:flex;align-items:center;padding:0 22px;gap:18px;background:#171a20}.title{margin-right:auto}.title strong{display:block;font-size:15px}.title span{font-size:12px;color:#949ba8}.tabs{display:flex;gap:8px}.tab{border:1px solid #343946;background:#20242c;color:#c9ced8;padding:10px 14px;border-radius:7px;cursor:pointer;font-weight:600}.tab:hover,.tab.active{background:#f4f5f7;color:#111318;border-color:#f4f5f7}.open{color:#b9f24c;font-size:13px;text-underline-offset:4px}.frame{height:calc(100% - 72px);background:white}.frame iframe{border:0;width:100%;height:100%;display:block}.mobile{display:none}@media(max-width:800px){.bar{height:auto;min-height:88px;padding:12px;flex-wrap:wrap}.title{width:100%}.tabs{width:100%;overflow:auto}.tab{white-space:nowrap}.open{display:none}.frame{height:calc(100% - 112px)}}
  </style>
</head>
<body>
  <header class="bar">
    <div class="title"><strong>Visual identity sketches</strong><span>Same story, three different stances</span></div>
    <div class="tabs" role="tablist" aria-label="Visual directions">
      <button class="tab active" data-src="001-editorial-authority/index.html">Editorial authority</button>
      <button class="tab" data-src="002-systems-signal/index.html">Systems signal</button>
      <button class="tab" data-src="003-pragmatic-field-notes/index.html">Field notes</button>
    </div>
    <a class="open" href="001-editorial-authority/index.html" target="_blank">Open full page ↗</a>
  </header>
  <main class="frame"><iframe title="Visual identity preview" src="001-editorial-authority/index.html"></iframe></main>
  <script>
    const frame=document.querySelector('iframe'),open=document.querySelector('.open');
    document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{
      document.querySelector('.tab.active').classList.remove('active');tab.classList.add('active');frame.src=tab.dataset.src;open.href=tab.dataset.src;
    }));
  </script>
</body>
</html>
