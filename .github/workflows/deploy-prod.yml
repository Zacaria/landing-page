name: Verify

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify static release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned verification dependencies
        run: npm ci --ignore-scripts

      - name: Run acceptance tests
        run: npm test

      - name: Build and validate static output
        run: |
          make build
          npm run lint
          npm run format:check

      - name: Validate design specification
        run: npx -y @google/design.md lint DESIGN.md
