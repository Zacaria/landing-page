name: Verify

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify static release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run acceptance tests
        run: python3 tests/test_site.py -q

      - name: Validate HTML and JavaScript
        run: |
          npx -y html-validate 'client/*.html' 'sketches/social-card-source.html'
          node --check client/assets/site.js

      - name: Validate design specification
        run: npx -y @google/design.md lint DESIGN.md

      - name: Build clean static output
        run: |
          make build
          diff -rq client dist
